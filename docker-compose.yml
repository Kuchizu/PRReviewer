services:
  db:
    image: postgres:15-alpine
    container_name: reviewer_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: reviewer_service
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d reviewer_service"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: reviewer_app
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/reviewer_service
      SQLALCHEMY_ECHO: "false"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
